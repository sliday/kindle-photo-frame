# Film Frame settings. Edit over USB, then restart the frame (KUAL > Film Frame > Start frame).

# Photos: 1072x1448 JPEG or PNG work best (tools/prep-photos.sh makes them).
photo_dir = /mnt/us/filmframe/photos
# shuffle = each photo once in random order, then reshuffle
# random  = any photo, repeats allowed
# name    = file name order
order = shuffle
# minutes between photo changes; 0 = change only when you swipe
photo_minutes = 30

# Touch overlay: how long the clock and weather stay up after a tap (5 to 8 feels right)
hold_seconds = 6
clock = 24h
# hold a finger still this long to leave the frame and return to the Kindle Home screen
long_press_seconds = 3

# Weather from open-meteo.com (no account). Set your own place; the example is London.
latitude = 51.5072
longitude = -0.1276
timezone = Europe/London
units = celsius
weather_minutes = 60
# true: Wi-Fi comes on only to fetch weather, then goes off again (saves battery)
wifi_power_save = true
# correct the Kindle clock from the weather server when it drifts more than 2 minutes
sync_clock = true

# Power. awake = never sleep, taps work any time (default; meant for a frame on a charger).
#   auto = sleep between photos on battery, awake on a charger; sleep = always sleep.
# Sleeping can hand the screen to the Kindle's own screensaver (ads on ad-supported
# Kindles) when it wakes, so only try auto/sleep if you need battery life.
power_mode = awake
awake_seconds = 60
# Front light 0..24 while the frame runs (0 = off, saves the most); -1 leaves it alone.
# Your own level comes back when you leave the frame.
frontlight = 0

# Display. Waveform for the fade steps: GC16 (default, best grays) or REAGL.
fade_waveform = GC16
fbink = auto
touch_device = auto
